name: webtrit_appearance_theme
resolution: workspace
description: "A Flutter package for managing appearance themes."
version: 0.0.1

environment:
  sdk: ^3.8.0

executables:
  webtrit_theme_schema: print_json_schema

dependencies:
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  # Used only by lib/builder.dart, which nothing imports at run time.
  analyzer: ^10.2.0
  build: ^4.0.4
  dart_style: ^3.1.7
  glob: ^2.1.3
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  build_runner: ^2.15.0
  json_serializable: ^6.14.1
  webtrit_analysis:
    git: https://github.com/WebTrit/webtrit_analysis.git
  test: ^1.31.0
